defaults:
  - model: conformer
  - datasets: custom_dir
  - dataloader: example
  - transforms: inference
  - _self_

custom_dir: ???
data_dir: datasets
split: test-clean
model:
  num_layers: 6
text_encoder:
  _target_: src.text_encoder.BPE
  tokenizer_path: pretrained/tokenizer.json
  beam_width: 1
metrics:
  inference: []
dataloader:
  batch_size: 8
  num_workers: 0
  pin_memory: false
inferencer:
  device_tensors: [spectrogram]
  device: auto
  save_path: predictions
  seed: 1
  from_pretrained: pretrained/model_best.pth
  decoding: greedy
  beam:
    beam_width: 8
    token_top_k: 16
    token_min_logp: -8.0
hydra:
  job:
    chdir: false
