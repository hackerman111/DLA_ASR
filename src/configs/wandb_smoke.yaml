defaults:
  - clean_4epochs
  - _self_

writer:
  project_name: dla_asr_logging_test
  run_name: wandb_smoke_${now:%Y%m%d_%H%M%S}
  mode: online
text_encoder:
  beam_width: 3
datasets:
  train:
    limit: 256
    max_audio_length: 12
    shuffle_index: true
  val:
    limit: 32
    max_audio_length: 12
    shuffle_index: true
metrics:
  train:
    - _target_: src.metrics.ctc.CorpusCTCMetric
      unit: word
      name: WER
    - _target_: src.metrics.ctc.CorpusCTCMetric
      unit: char
      name: CER
trainer:
  n_epochs: 2
  log_step: 2
  examples_to_log: 1
