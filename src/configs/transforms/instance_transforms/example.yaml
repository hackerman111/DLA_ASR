train:
  get_spectrogram: # special key for getting spectrogram
    _target_: torchaudio.transforms.MelSpectrogram
    sample_rate: 16000
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.Gain
        min_gain_in_db: -6.0
        max_gain_in_db: 6.0
        p: 0.5
        sample_rate: 16000
      - _target_: src.transforms.wav_augs.PitchShift
        min_transpose_semitones: -1.0
        max_transpose_semitones: 1.0
        p: 0.3
        sample_rate: 16000
  spectrogram:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.spec_augs.TimeStretch
        min_rate: 0.9
        max_rate: 1.1
        p: 0.3
      - _target_: src.transforms.spec_augs.TimeMasking
        time_mask_param: 20
        max_mask_fraction: 0.1
        p: 0.3
      - _target_: src.transforms.spec_augs.FrequencyMasking
        freq_mask_param: 8
        p: 0.3
inference:
  get_spectrogram:
    _target_: torchaudio.transforms.MelSpectrogram
    sample_rate: 16000
